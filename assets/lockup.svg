<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480">
  <rect width="1400" height="480" fill="#ffffff"/>

  <!-- South Pillar — horizontal lockup.
       Mark on the left, two-line wordmark on the right.
       The mark height matches the cap-to-baseline of the two-line wordmark
       for a balanced lockup. -->

  <!-- Mark: scaled to match wordmark height -->
  <g transform="translate(280, 95) scale(0.95)" fill="#111111">
    <rect x="-18" y="0" width="132" height="16"/>
    <rect x="0" y="24"  width="96" height="46"/>
    <rect x="0" y="74"  width="96" height="46"/>
    <rect x="0" y="124" width="96" height="46"/>
    <rect x="0" y="174" width="96" height="46"/>
    <rect x="0" y="224" width="96" height="46"/>
    <rect x="-18" y="274" width="132" height="16"/>
  </g>

  <!-- Wordmark: serif, two-line stack, generous tracking -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="400" fill="#111111">
    <text x="540" y="225" font-size="110" letter-spacing="12">SOUTH</text>
    <text x="540" y="345" font-size="110" letter-spacing="12">PILLAR</text>
  </g>
</svg>
